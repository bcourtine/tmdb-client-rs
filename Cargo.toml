[package]
name = "tmdb_client"
version = "1.8.0"
authors = ["Benoît Courtine <benoit.courtine@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/bcourtine/tmdb-client-rs"
documentation = "https://docs.rs/crate/tmdb_client"
homepage = "https://crates.io/crates/tmdb_client"
description = """
Rust client for The Movie Database (TMDB) API.
"""
keywords = ["tmdb", "api", "client"]
categories = ["api-bindings"]
edition = "2021"

[dependencies]
chrono = "^0.4"
flate2 = { version = "^1.1", optional = true }
serde = "^1.0"
serde_derive = "^1.0"
serde_json = "^1.0"
serde_with = "^3.14"
thiserror = "2.0"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
] }
tokio = { version = "1.47", features = ["macros"], optional = true }
async-trait = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["native-tls", "blocking"]
native-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
daily-exports = ["dep:flate2"]
blocking = ["reqwest/blocking"]
async = ["dep:tokio", "dep:async-trait"]

[dev-dependencies]
futures = "0.3"
